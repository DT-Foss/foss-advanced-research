name: Verify Reference Implementations

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-uav-simulation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f Portfolio_Optimized/03_Reference_Implementations/FH-SS_UAV_Simulation/requirements.txt ]; then pip install -r Portfolio_Optimized/03_Reference_Implementations/FH-SS_UAV_Simulation/requirements.txt; fi

    - name: Run UAV PINN Simulation
      working-directory: ./Portfolio_Optimized/03_Reference_Implementations/FH-SS_UAV_Simulation
      run: python simulation.py

    - name: Archive Trajectory Plot
      uses: actions/upload-artifact@v3
      with:
        name: landing-trajectory
        path: Portfolio_Optimized/03_Reference_Implementations/FH-SS_UAV_Simulation/landing_trajectory.png
